[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kmeans-visualizer"
version = "2.0.0"
description = "交互式二维 K-Means 聚类迭代过程可视化"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "拼好组" }]
dependencies = ["numpy>=1.20", "matplotlib>=3.5"]

[project.scripts]
kmeans-lab = "kmeans_lab.main:main"

[project.optional-dependencies]
dev = ["coverage>=7.0"]

[tool.setuptools]
packages = ["kmeans_lab"]
